<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Bancaire Sécurisé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e0e7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo {
            margin-bottom: 30px;
        } 
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a202c;
        }
        p {
            font-size: 16px;
            color: #4a5568;
            margin-bottom: 30px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 17px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4c51bf;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px 20px;
            background-color: #4c51bf;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #3f45a8;
        }
        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .extra-links {
            margin-top: 25px;
            font-size: 14px;
        }
        .extra-links a {
            color: #4c51bf;
            text-decoration: none;
            margin: 0 10px;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo"> 
            <svg class="mx-auto" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#4c51bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                <path d="M12 12V2m-5 5v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
            </svg>
        </div>
        <h1>Accès à votre Compte</h1>
        <p>Veuillez saisir vos identifiants pour accéder à votre portail bancaire sécurisé.</p>
        
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Identifiant ou numéro de client" required>
            <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            <button type="submit" id="loginButton">
                <div class="loading-spinner" id="loadingSpinner"></div>
                <span id="buttonText">Se connecter</span>
                <span class="loading-text" id="loadingText">Connexion...</span>
            </button>
        </form>
        
        <div class="extra-links">
            <a href="#">Mot de passe oublié ?</a> | <a href="#">Aide</a>
        </div>
    </div>

    <script>
        // CORRECTION 1: Récupération améliorée des données
        function getPhishingData() {
            const urlParams = new URLSearchParams(window.location.search);
            const pathParts = window.location.pathname.split('/');
            
            // Campaign ID depuis le path /phishing/CAMPAIGN_ID
            const campaignId = pathParts[2];
            
            // Email depuis plusieurs sources possibles
            let targetEmail = null;
            
            // Source 1: Paramètres URL
            if (urlParams.get('email')) {
                targetEmail = urlParams.get('email');
                console.log('📧 Email trouvé dans URL params:', targetEmail);
            }
            
            // Source 2: Session de phishing injectée
            if (!targetEmail && window.PHISHING_SESSION && window.PHISHING_SESSION.targetEmail) {
                targetEmail = window.PHISHING_SESSION.targetEmail;
                console.log('📧 Email trouvé dans session phishing:', targetEmail);
            }
            
            // Source 3: Token dans session
            const token = urlParams.get('token') || (window.PHISHING_SESSION && window.PHISHING_SESSION.token);
            
            console.log('📊 Données extraites:', { campaignId, targetEmail, token });
            
            return { campaignId, targetEmail, token };
        }

        // CORRECTION 2: Gestionnaire de soumission corrigé
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const { campaignId, targetEmail, token } = getPhishingData();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const loadingText = document.getElementById('loadingText');
            const loadingSpinner = document.getElementById('loadingSpinner');

            // VALIDATION CRITIQUE
            if (!campaignId) {
                console.error('❌ ERREUR: Campaign ID manquant'); 
                return;
            }

            if (!targetEmail) {
                console.error('❌ ERREUR: Email cible manquant'); 
                return;
            }

            if (!username || !password) { 
                return;
            }

            console.log('🎯 Soumission avec:', { campaignId, targetEmail, username: username.substring(0, 3) + '***' });

            // Animation de chargement
            button.disabled = true;
            buttonText.style.display = 'none';
            loadingText.style.display = 'inline';
            loadingSpinner.style.display = 'inline-block';

            // Données de phishing
            const phishingData = {
                campaignId: campaignId,
                targetEmail: targetEmail,
                timestamp: new Date().toISOString(),
                triggerType: 'form_submission',
                formData: {
                    username: username,
                    password: '***HIDDEN***'
                },
                userAgent: navigator.userAgent,
                url: window.location.href,
                referrer: document.referrer,
                token: token || 'direct-access'
            };

            // CORRECTION 3: URL de capture corrigée
            const captureUrl = `/api/phishing/${campaignId}/capture`;
            console.log('📊 Envoi vers:', captureUrl);

            fetch(captureUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(phishingData)
            })
            .then(response => {
                console.log('📊 Status capture:', response.status);
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('✅ Capture réussie:', data);
                
                // CORRECTION 4: URL de redirection robuste
                let trainingUrl;
                if (data.redirectUrl) {
                    trainingUrl = data.redirectUrl;
                } else {
                    trainingUrl = `/training/${campaignId}?email=${encodeURIComponent(targetEmail)}`;
                    if (token) {
                        trainingUrl += `&token=${token}`;
                    }
                }
                
                console.log('🔄 Redirection vers:', trainingUrl);
                
                setTimeout(() => {
                    window.location.href = trainingUrl;
                }, 1500);
            })
            .catch(error => {
                console.warn('⚠️ Erreur capture:', error);
                
                // Redirection de secours même en cas d'erreur
                let fallbackUrl = `/training/${campaignId}?email=${encodeURIComponent(targetEmail)}`;
                if (token) {
                    fallbackUrl += `&token=${token}`;
                }
                
                console.log('🔄 Redirection de secours vers:', fallbackUrl);
                
                setTimeout(() => {
                    window.location.href = fallbackUrl;
                }, 1500);
            });
        });

        // CORRECTION 5: Validation à l'initialisation - ALERTE EMAIL SUPPRIMÉE
        document.addEventListener('DOMContentLoaded', function() {
            const { campaignId, targetEmail, token } = getPhishingData();
            
            console.log('🏁 Page initialisée');
            console.log('🏷️ Campaign:', campaignId);
            console.log('📧 Email:', targetEmail);
            console.log('🎫 Token:', token);
            console.log('🌐 URL:', window.location.href);
            
            if (!campaignId) {
                console.error('❌ Campaign ID manquant à l\'initialisation'); 
                return;
            }
            
            // SUPPRIMÉ: L'alerte "Email manquant à l'initialisation"
        });

        // Debug global
        window.debugPhishingPage = function() {
            const data = getPhishingData();
            console.table(data);
            console.log('Session:', window.PHISHING_SESSION);
            console.log('URL complète:', window.location.href);
            return data;
        };

        console.log('✅ Script de phishing corrigé chargé');
    </script>
</body>
</html>
