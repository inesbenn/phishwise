<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion VPN d'Entreprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark background for corporate feel */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #e2e8f0;
        }
        .login-container {
            background-color: #2d3748; /* Darker grey for container */
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #4a5568;
        }
        .logo {
            margin-bottom: 30px;
        }
        .logo svg {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            color: #63b3ed; /* Blue for VPN icon */
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
        }
        p {
            font-size: 16px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
            text-align: left;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            background-color: #4a5568; /* Dark input background */
            border: 1px solid #6b7280;
            border-radius: 6px;
            font-size: 16px;
            color: #e2e8f0;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #63b3ed;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px 20px;
            background-color: #63b3ed; /* Blue button */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #4299e1;
        }
        .support-link {
            margin-top: 25px;
            font-size: 14px;
        }
        .support-link a {
            color: #63b3ed;
            text-decoration: none;
        }
        .support-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <!-- VPN icon -->
            <svg class="mx-auto" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                <path d="M2 17l10 5 10-5"></path>
                <path d="M2 12l10 5 10-5"></path>
            </svg>
        </div>
        <h1>Accès VPN Sécurisé</h1>
        <p>Connectez-vous pour accéder au réseau interne de l'entreprise.</p>
        <form action="/login" method="POST">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" placeholder="Votre nom d'utilisateur" required>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
            <button type="submit">Se connecter au VPN</button>
        </form>
        <div class="support-link">
            <a href="#">Besoin d'aide ? Contactez le support informatique.</a>
        </div>
    </div>
</body>
</html>
