<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion à LinkedIn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f2ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 0 1px rgb(0 0 0 / 15%), 0 6px 9px rgb(0 0 0 / 20%);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: left;
        }
        .logo {
            margin-bottom: 24px;
        }
        .logo img {
            width: 100px;
            height: auto;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #000000e6;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #00000099;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px 24px;
            background-color: #0a66c2;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button[type="submit"]:hover {
            background-color: #004182;
        }
        .forgot-password {
            margin-top: 16px;
            text-align: center;
        }
        .forgot-password a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .join-now {
            margin-top: 24px;
            text-align: center;
            font-size: 16px;
            color: #00000099;
        }
        .join-now a {
            color: #0a66c2;
            text-decoration: none;
            font-weight: 600;
        }
        .join-now a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/images/logos/linkedin-logo.png" alt="LinkedIn Logo">
        </div>
        <h1>Connectez-vous</h1>
        <form action="/login" method="POST">
            <label for="username">E-mail ou téléphone</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Se connecter</button>
        </form>
        <div class="forgot-password">
            <a href="#">Mot de passe oublié ?</a>
        </div>
        <div class="join-now">
            Nouveau sur LinkedIn ? <a href="#">S'inscrire maintenant</a>
        </div>
    </div>
</body>
</html>
